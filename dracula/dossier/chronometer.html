     THE DRACULA CHRONOMETER  (Amenti-Readings/dracula/dossier/chronometer.html)
     25 Oct 2026. The book's emblem as a clock. Two faces:
       CHAPTERS · the 27 chapters around the rim, the 24 hours inside (27:24 =
         9:8, so they meet at I/00, X/08 and XIX/16). The inner ring is shaded
         for day and night at the place and date of the entry: the vampire's
         hours. A hand points to the chapter, a second to the hour if the entry
         gives one.
       CALENDAR · the 187 days, 3 May to 6 November 1893, with the three books
         as bands (Books I and II run side by side), every dated entry as a tick
         and the real moon of 1893 round the edge.
     Every date comes from the cue sheets (ep01–ep27.json): 166 dated entries.
     Following the reading: ?ep=23&n=40 opens at that cue; a page that embeds
     this in an iframe can post {type:'amenti-cue', ep, n} and the hands move.
     =========================================================================== -->
