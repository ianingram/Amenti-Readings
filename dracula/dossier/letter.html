    <h1>The Count’s Letter</h1>
    <p class="lede">Waiting for Jonathan at the Golden Krone, Bistritz, on the 3rd of May.</p>
  </header>
  <div class="stage" role="img" aria-label="A handwritten letter: My Friend. Welcome to the Carpathians. I am anxiously expecting you. Sleep well to-night. At three to-morrow the diligence will start for Bukovina; a place on it is kept for you. At the Borgo Pass my carriage will await you and will bring you to me. I trust that your journey from London has been a happy one, and that you will enjoy your stay in my beautiful land. Your friend, Dracula.">

  </div>
  <div class="bar"><p class="note">The words are Stoker’s, as Jonathan copied the letter into his journal.</p><button id="play" type="button">Read it again</button></div>
