<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amenti Readings — Re-record Lines</title>
<style>
  :root { --bg:#0e0c0a; --panel:#17140f; --ink:#e9e1cf; --dim:#9c927d; --gold:#c9a45a; --red:#d0644f; --green:#7fae6a; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 Georgia, serif; }
  main { max-width:760px; margin:0 auto; padding:28px 16px 60px; }
  h1 { font-weight:normal; color:var(--gold); margin:0 0 6px; }
  p { color:var(--dim); }
  button { font:inherit; background:var(--gold); color:#1a1408; border:0; border-radius:4px; padding:10px 18px; cursor:pointer; }
  button:disabled { opacity:.45; cursor:default; }
  #log { font:12px/1.6 Menlo, monospace; color:var(--dim); white-space:pre-wrap; background:var(--panel); border-radius:6px; padding:14px; margin-top:16px; max-height:60vh; overflow:auto; }
  .ok { color:var(--green); } .bad { color:var(--red); }
</style>
</head>
<body>
<main>
  <h1>Re-record Lines</h1>
  <p>Records the short narrator tails of Dracula chapters 6–17 together with the clause before each, so they can be spliced onto their paragraphs instead of coming back as invented sentences. Each take is checked for length and tried up to three times.</p>
  <button id="go" disabled>Record</button>
  <div id="log"></div>
</main>
<script src="https://ianingram.github.io/Amenti.live/amenti-core.bundle.js"></script>
<script src="https://ianingram.github.io/Amenti-Readings/player/reader.js"></script>
<script src="https://ianingram.github.io/Amenti-Readings/player/casting.js"></script>
<script>
/* RE-RECORD · 15 Oct 2026 (evening): the 14 short tails of Dracula ch 6–17, each with its clause, for splicing.
   Earlier the same day: Dracula ep04 cue 75 and Carol ep01 cue 172 (0-based 74, 171). F.work picks the production (default quo-vadis).
   Earlier: 14 Oct 2026. The list below came from checking every Book I take in the archive:
   each was transcribed and found garbled, or never recorded. A piece is sent exactly as the player
   sends it (same text, style and voice, so the same archive key) with ?fresh=1, which replaces
   the stored take. A take whose length cannot fit its words is tried again, up to three times. */
(function () {
  var FIX = [{"work": "dracula", "ch": 6, "cue": 53, "text": "so I said I would see about it, and asked him if he would not rather have a cat than a kitten.", "why": "short tail “than a kitten.” — recorded with its clause, to splice"}, {"work": "dracula", "ch": 7, "cue": 10, "text": "for the roar of the tempest, and the crash of the thunder, and the booming of the mighty billows came through the damp oblivion even louder than before.", "why": "short tail “even louder than before.” — recorded with its clause, to splice"}, {"work": "dracula", "ch": 7, "cue": 13, "text": "since the tiller, as emblemship, if not proof, of delegated possession, is held in a dead hand.", "why": "short tail “hand .” — recorded with its clause, to splice"}, {"work": "dracula", "ch": 8, "cue": 4, "text": "for by-and-by, when her breathing became quieter, she put her hand to her throat again and moaned.", "why": "short tail “moaned.” — recorded with its clause, to splice"}, {"work": "dracula", "ch": 9, "cue": 24, "text": "Even the offer of a kitten or even a full-grown cat will not tempt him. He will only say:", "why": "short tail “He will only say:” — recorded with its clause, to splice"}, {"work": "dracula", "ch": 9, "cue": 48, "text": "I do not care for myself, but all for him! So I am quite free.", "why": "short tail “So I am quite free.” — recorded with its clause, to splice"}, {"work": "dracula", "ch": 10, "cue": 99, "text": "Thank everybody for being so good to me! Thank God! Good-night, Arthur.", "why": "short tail “Good-night, Arthur.” — recorded with its clause, to splice"}, {"work": "dracula", "ch": 10, "cue": 134, "text": "Do not fear to think even the most not-probable. Good-night.", "why": "short tail “Good-night.”” — recorded with its clause, to splice"}, {"work": "dracula", "ch": 11, "cue": 73, "text": "It’s a shyme that people are allowed to top their walls with broken bottles. This ’ere’s what comes of it. Come along, Bersicker.", "why": "short tail “Come along, Bersicker.”” — recorded with its clause, to splice"}, {"work": "dracula", "ch": 12, "cue": 60, "text": "when she woke the softness of her eyes evidently changed the expression, for she looked her own self, although a dying one.", "why": "short tail “although a dying one.” — recorded with its clause, to splice"}, {"work": "dracula", "ch": 12, "cue": 62, "text": "I fear that to-morrow will end our watching, for the shock has been too great; the poor child cannot rally. God help us all.", "why": "short tail “God help us all.” — recorded with its clause, to splice"}, {"work": "dracula", "ch": 13, "cue": 4, "text": "and so might in ignorance make some unnecessary trouble. He answered me:", "why": "short tail “He answered me:—” — recorded with its clause, to splice"}, {"work": "dracula", "ch": 14, "cue": 129, "text": "and that there lie the Indian fakir, not dead, but that rise up and walk amongst them as before?", "why": "short tail “amongst them as before?”” — recorded with its clause, to splice"}, {"work": "dracula", "ch": 16, "cue": 49, "text": "and last a round wooden stake, some two and a half or three inches thick and about three feet long.", "why": "short tail “about three feet long.” — recorded with its clause, to splice"}];
  var VOICE = 'https://amenti-proxy.ingram-ian.workers.dev/speak';
  var R = window.Amenti && window.Amenti.reading, E = window.Amenti && window.Amenti.throttle;
  var $ = function (id) { return document.getElementById(id); };
  function log(s, cls) { var d = document.createElement('div'); if (cls) d.className = cls; d.textContent = s; $('log').appendChild(d); $('log').scrollTop = 1e9; }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  if (!R || !E) { log('The voice engine did not load.', 'bad'); return; }
  var actx = new (window.AudioContext || window.webkitAudioContext)();
  function fits(secs, n) { var exp = n / 12.5 + 1.2; return !(secs > 1.6 * exp && secs - exp > 2.5) && secs >= (n > 40 ? 0.35 * exp : 0.3); }
  function once(body) {
    return fetch(VOICE + '?fresh=1', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) {
        if (!r.ok) return r.text().then(function (t) { return { err: r.status + ' ' + t.slice(0, 120), status: r.status }; });
        return r.arrayBuffer().then(function (b) { return actx.decodeAudioData(b); }).then(function (a) { return { secs: a.duration }; });
      }, function (e) { return { err: String(e && e.message) }; });
  }
  function piece(body, label) {
    var n = body.text.length, tries = 0;
    function go() {
      tries++;
      return once(body).then(function (res) {
        if (res.err) {
          log('  ' + label + ' — attempt ' + tries + ': ' + res.err, 'bad');
          if (tries < 3) return sleep(res.status === 429 ? 60000 : 8000).then(go);
          return false;
        }
        if (fits(res.secs, n)) { log('  ' + label + ' — good take, ' + res.secs.toFixed(1) + 's for ' + n + ' characters', 'ok'); return true; }
        log('  ' + label + ' — attempt ' + tries + ' came back ' + res.secs.toFixed(1) + 's for ' + n + ' characters: wrong length', 'bad');
        if (tries < 3) return sleep(7000).then(go);
        return false;
      });
    }
    return go();
  }
  $('go').textContent = 'Record ' + FIX.length + ' pieces';
  $('go').disabled = false;
  $('go').onclick = function () {
    $('go').disabled = true; actx.resume && actx.resume();
    var good = 0, bad = [], i = 0;
    function next() {
      if (i >= FIX.length) {
        log(''); log(bad.length ? (good + ' fixed; still wrong: ' + bad.join(', ') + '. Press again later to retry.') : ('All ' + good + ' fixed.'), bad.length ? 'bad' : 'ok');
        $('go').disabled = false; return;
      }
      var F = FIX[i++], label = F.voice ? ('Shout ' + i) : ((F.work ? F.work.replace(/-/g, ' ') + ', ' : '') + 'chapter ' + F.ch + ', line ' + (F.cue + 1));
      if (!F.voice) log(label + (F.text ? ' (end of the sentence)' : F.piece ? '' : ' (whole line)'));
      if (F.voice) { log(label + ' — ' + F.voice + ': ' + F.text);
        return piece({ text: F.text, style: F.style, voice: F.voice }, 'take').then(function (ok) { if (ok) good++; else bad.push(label); return sleep(4000); }).then(next); }
      return R.load((F.work || 'quo-vadis') + '/ep' + pad(F.ch) + '.json').then(function (sheet) {
        var c = sheet.cues[F.cue], text = R.spoken(c);
        if (R.direction(c)) { log('  has a line direction — skipped (tell Claude)', 'bad'); bad.push(label); return; }
        return E.resolveVoice(R.nameFor(c)).then(function (v) {
          var chunks = E.chunk(text).map(function (x) { return (x && x.text != null) ? x.text : x; });
          var want = F.text ? [F.text] : F.piece ? chunks.filter(function (t) { return t.replace(/\s+/g, ' ').trim() === F.piece.replace(/\s+/g, ' ').trim(); }) : chunks;
          if (!want.length) { log('  piece not found in the script — skipped (tell Claude)', 'bad'); bad.push(label); return; }
          var model = E.model && E.model();
          return want.reduce(function (p, t, j) {
            return p.then(function (allOk) {
              var body = { text: t, style: v.style, voice: v.voice || 'Kore' }; if (model) body.model = model;
              return piece(body, want.length > 1 ? 'piece ' + (j + 1) + ' of ' + want.length : 'take').then(function (ok) { return sleep(6000).then(function () { return allOk && ok; }); });
            });
          }, Promise.resolve(true)).then(function (ok) { if (ok) good++; else bad.push(label); });
        });
      }).then(next, function (e) { log('  error: ' + e.message, 'bad'); bad.push(label); next(); });
    }
    log('Re-recording ' + FIX.length + ' lines…'); next();
  };
})();
</script>
</body>
</html>
